[package]
name = "agent-remote-desktop"
version = "1.0.0"
description = "The macOS wrapper for Agent Remote"
authors = ["Agent Remote"]
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
url = "2"
