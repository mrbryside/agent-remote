<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Agent Remote</title>
    <style>
      :root { color-scheme: dark; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      body { align-items: center; background: #141416; color: #f5f5f7; display: flex; height: 100vh; justify-content: center; margin: 0; }
      main { max-width: 29rem; padding: 2rem; text-align: center; }
      h1 { font-size: 1.35rem; margin: 0 0 .5rem; }
      p { color: #b8b8c0; line-height: 1.5; margin: 0; }
      p[hidden] { display: none; }
      #error { color: #ffb4ab; }
    </style>
  </head>
  <body>
    <main>
      <h1>Starting Agent Remote</h1>
      <p id="status">Connecting to the local workspace…</p>
      <p id="error" hidden></p>
    </main>
    <script>
      window.showDesktopError = (message) => {
        document.querySelector('#status').hidden = true;
        const error = document.querySelector('#error');
        error.textContent = message;
        error.hidden = false;
      };
    </script>
  </body>
</html>
